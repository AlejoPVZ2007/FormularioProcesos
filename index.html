<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Procesos DEAC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>Plantilla de Consulta de Procesos DEAC</h1>
            <p class="intro">Completa las etapas para consultar el proceso y sus costos aproximados.</p>
        </header>

        <section class="etapa" aria-labelledby="etapa1">
            <h2 id="etapa1"><span class="numero-etapa">1</span> Etapa 1: Aplicación</h2>

            <div class="campo">
                <label for="proceso">Porcentaje de cambio del Plan Curricular</label>
                <select id="proceso" name="proceso">
                    <option value="">-- Seleccionar % de Cambio --</option>
                    <option value="mayor">Mayor del 20%</option>
                    <option value="menor">Menor del 20%</option>
                </select>
            </div>

            <p class="nota-titulo"><strong>Nota:</strong> <span id="codigo-proceso" aria-live="polite"></span></p>

            <div class="campo">
                <label for="tipo">Tipo de proceso a presentar</label>
                <select id="tipo" name="tipo">
                    <option value="">-- Selecciona Tipo de Proceso --</option>
                </select>
            </div>

            <p class="costo-base"><strong>Costo base:</strong> <span id="costo-base" aria-live="polite"></span></p>

            <div class="campo">
                <label for="nivelAcademico">Nivel académico del programa a presentar</label>
                <select id="nivelAcademico" name="nivelAcademico" disabled>
                    <option value="">-- Seleccionar nivel académico --</option>
                    <option value="pregrado">Pregrado</option>
                    <option value="maestria">Maestría</option>
                    <option value="doctorado">Doctorado</option>
                    <option value="segunda">Segunda Especialidad</option>
                </select>
            </div>

            <div class="campo">
                <label for="cantidad">N° de cursos nuevos en el Plan Curricular</label>
                <select id="cantidad" name="cantidad" disabled>
                    <option value="">-- Selecciona primero el nivel académico --</option>
                </select>
            </div>

            <fieldset class="campo sedes" disabled>
                <legend>Sedes en las que se dictará el programa</legend>
                <label class="sede-opcion" for="sede-molina">
                    <input type="checkbox" id="sede-molina" name="molina" value="molina">
                    La Molina
                </label>
                <label class="sede-opcion" for="sede-norte">
                    <input type="checkbox" id="sede-norte" name="norte" value="norte">
                    Lima Norte
                </label>
                <label class="sede-opcion" for="sede-pachacamac">
                    <input type="checkbox" id="sede-pachacamac" name="pachacamac" value="pachacamac">
                    Pachacamac
                </label>
            </fieldset>
        </section>

        <section class="etapa" aria-labelledby="etapa2">
            <h2 id="etapa2"><span class="numero-etapa">2</span> Etapa 2</h2>

            <div class="costos">
                <div class="campo">
                    <label for="costo-cursos">Costo aproximado del 25% de cursos seleccionados por DEAC</label>
                    <input type="text" id="costo-cursos" value="$500.00" readonly>
                </div>
                <div class="campo">
                    <label for="costo-revision">Costo aproximado de la Revisión de Seguimiento del Especialista</label>
                    <input type="text" id="costo-revision" value="$1,200.00" readonly>
                </div>
            </div>
        </section>

        <section class="etapa" aria-labelledby="etapa3">
            <h2 id="etapa3"><span class="numero-etapa">3</span> Etapa 3</h2>

            <div class="costos">
                <div class="campo">
                    <label for="costo-visita">Costo aproximado de la Visita de DEAC</label>
                    <input type="text" id="costo-visita" value="$12,441.00" readonly>
                </div>
            </div>
        </section>

        <section class="etapa" aria-labelledby="etapa4">
            <h2 id="etapa4"><span class="numero-etapa">4</span> Costos totales</h2>

            <div class="costos">
                <div class="campo total">
                    <label for="total-dolares">Costo total en dólares</label>
                    <input type="text" id="total-dolares" value="$15,741.00" readonly>
                </div>
                <div class="campo total">
                    <label for="total-soles">Costo total en soles</label>
                    <input type="text" id="total-soles" value="S/ 56,667.60" readonly>
                </div>
            </div>
        </section>

        <div class="acciones">
            <div class="contador-visitas" hidden>
                👁️ Visitas: <span id="visitas">...</span>
            </div>
            <button type="button" id="otraConsulta">Realizar otra consulta</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
